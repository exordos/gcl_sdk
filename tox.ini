[tox]
envlist = begin,py3{10,11,12,13,14},end
          py3{10,11,12,13,14}-functional
          py312-libvirt
          ruff,ruff-check,mypy
minversion = 2.0
skipsdist = false
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
extras =
  test
  libvirt: libvirt
setenv =
  PACKAGE_NAME=gcl_sdk
  TEST_PATH={env:PACKAGE_NAME}/tests/unit
  functional: TEST_PATH={env:PACKAGE_NAME}/tests/functional
  functional: DATABASE_URI={env:DATABASE_URI:postgresql://gcl_sdk:pass@localhost:5432/gcl_sdk}
commands =
  coverage run -p -m pytest {posargs} --timer-top-n=10 {env:TEST_PATH}

[testenv:begin]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
commands =
  coverage erase

[testenv:end]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
commands =
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report --skip-covered

[testenv:sdn-integration]
# Fast VM-less SDN dataplane integration tests: real OVS + netns + the real
# agent code. REQUIRES ROOT and ovs-vsctl/ovs-ofctl/ip/conntrack/dhclient/dig
# on the host. Build with `tox -e sdn-integration --notest`, then ALWAYS use
# gcl_sdk/tests/integration/run-isolated.sh (see the tier README). Bare root
# pytest/tox is rejected: netns alone does not isolate DHCP's host DNS hooks.
runner = uv-venv-lock-runner
extras =
  test
commands =
  pytest {posargs} --timer-top-n=10 gcl_sdk/tests/integration/sdn

[testenv:sdn-fabric]
# Full-fabric SDN integration: the real EVPN control+data plane on one host
# (RR gobgpd + host gobgpd + the real evpn_connector + the real driver code).
# REQUIRES ROOT + the same tools as sdn-integration, PLUS a one-time cache
# built by the prepare script (gobgpd binaries + the evpn_connector venv):
#   EVPN_CONNECTOR_PATH=/path/to/evpn_connector \
#     gcl_sdk/tests/integration/sdn_fabric/prepare.sh
# Build with `tox -e sdn-fabric --notest`, then ALWAYS use the shared
# gcl_sdk/tests/integration/run-isolated.sh (see the tier README).
# Bare root pytest/tox is rejected; missing root/tools/cache skip off CI.
runner = uv-venv-lock-runner
extras =
  test
commands =
  pytest {posargs} --timer-top-n=10 gcl_sdk/tests/integration/sdn_fabric

[testenv:ruff-check]
extras =
  ruff
runner = uv-venv-lock-runner
commands = ruff check .

[testenv:ruff]
extras =
  ruff
runner = uv-venv-lock-runner
commands =
  ruff check . --fix
  ruff check --select I --fix
  ruff format

[testenv:mypy]
extras =
  mypy
runner = uv-venv-lock-runner
commands = mypy -p gcl_sdk

[testenv:docs]
extras =
  docs
runner = uv-venv-lock-runner
commands = mkdocs serve --dev-addr 0.0.0.0:8181 --livereload

[testenv:docs-deploy]
extras =
  docs
runner = uv-venv-lock-runner
commands = mkdocs gh-deploy --force

[testenv:develop]
runner = uv-venv-lock-runner
extras =
  test
usedevelop=true